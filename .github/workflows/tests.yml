name: Tests

on:
  workflow_call:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP Action
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

name: Run PHPUnit
description: Install PHP and dependencies, then run the test suite. Requires the repository to be checked out first.

runs:
  using: composite
  steps:
    - name: Setup PHP Action
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.4"

    - name: Install PHP dependencies
      shell: bash
      run: composer install --prefer-dist --no-progress

    - name: Run tests
      shell: bash
      run: vendor/bin/phpunit

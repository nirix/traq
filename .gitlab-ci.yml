# Mirrors .github/workflows/build-tag.yml
# Runs on tags like v3.8, v4.0.1, v4.0.0-beta

stages:
  - release

build-tag:
  stage: release
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.+\..+/
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        php-cli php-xml php-mbstring php-zip php-curl php-intl
        unzip zip git curl ca-certificates gnupg
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - npm install -g pnpm
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - pnpm i
    - pnpm run build
    - composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
    - |
      rm -rf .github .gitlab-ci.yml .vscode .git dev node_modules src/assets
      rm -rf vendor/avalon/framework/.git vendor/filp
      rm -f .eslintrc.cjs .gitignore .prettierrc.json
      rm -f ./*.json ./*.lock ./*.yml ./*.yaml ./*.js ./*.ts
    - zip -r "traq-${CI_COMMIT_TAG}.zip" . -x "traq-${CI_COMMIT_TAG}.zip" -x "traq-${CI_COMMIT_TAG}.tar.gz"
    - tar -czf "traq-${CI_COMMIT_TAG}.tar.gz" --exclude="traq-${CI_COMMIT_TAG}.zip" --exclude="traq-${CI_COMMIT_TAG}.tar.gz" .
  artifacts:
    name: "traq-$CI_COMMIT_TAG"
    paths:
      - "traq-$CI_COMMIT_TAG.zip"
      - "traq-$CI_COMMIT_TAG.tar.gz"
    expire_in: never
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "Traq $CI_COMMIT_TAG"
    assets:
      links:
        - name: "traq-$CI_COMMIT_TAG.zip"
          url: "$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$CI_JOB_ID/artifacts/raw/traq-$CI_COMMIT_TAG.zip"
          link_type: package
        - name: "traq-$CI_COMMIT_TAG.tar.gz"
          url: "$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$CI_JOB_ID/artifacts/raw/traq-$CI_COMMIT_TAG.tar.gz"
          link_type: package
